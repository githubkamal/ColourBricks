name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "24"
  # Matches local XAMPP (MariaDB 10.4). No Docker in dev/prod; CI uses a service container.
  TEST_CONNECTION: "Server=127.0.0.1;Port=3306;Database=colourbricks_test;User ID=root;Password=;TreatTinyAsBoolean=false;AllowUserVariables=true;UseAffectedRows=false"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
          MARIADB_DATABASE: colourbricks_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet tool restore
      - name: Apply migrations
        run: dotnet ef database update -p src/ColourBricks.Infrastructure -s src/ColourBricks.Api
        env:
          COLOURBRICKS_MIGRATIONS_CONNECTION: ${{ env.TEST_CONNECTION }}
      - run: dotnet build --configuration Release -warnaserror
      - name: Test
        run: dotnet test --configuration Release --no-build
        env:
          COLOURBRICKS_TEST_CONNECTION: ${{ env.TEST_CONNECTION }}
      # BRD §38 / plan.md §11 safety net — a named gate so a control regression is unmissable.
      - name: Data integrity controls
        run: dotnet test --configuration Release --no-build --filter "Category=IntegrityControls"
        env:
          COLOURBRICKS_TEST_CONNECTION: ${{ env.TEST_CONNECTION }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - run: npm run test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mariadb:
        image: mariadb:10.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
          MARIADB_DATABASE: colourbricks
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply migrations (dev database)
        working-directory: backend
        run: |
          dotnet tool restore
          dotnet ef database update -p src/ColourBricks.Infrastructure -s src/ColourBricks.Api
        env:
          COLOURBRICKS_MIGRATIONS_CONNECTION: "Server=127.0.0.1;Port=3306;Database=colourbricks;User ID=root;Password=;AllowUserVariables=true;UseAffectedRows=false"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E
        working-directory: frontend
        run: npx playwright test
        env:
          CI: "true"
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Default: "Server=127.0.0.1;Port=3306;Database=colourbricks;User ID=root;Password=;TreatTinyAsBoolean=false;AllowUserVariables=true;UseAffectedRows=false"
