# Deployed as /etc/nginx/sites-available/colourbricks on 62.72.58.99 (a shared box —
# see docs/deployment.md "Deploying to a shared box"). Ports/domains below are this
# deployment's actual values; adjust if you're standing this up somewhere else.
#
# Install: sudo cp deploy/nginx/colourbricks.conf /etc/nginx/sites-available/colourbricks
#          sudo ln -s /etc/nginx/sites-available/colourbricks /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then: sudo certbot --nginx -d app.colourbricks.livewiresdigitalsolutions.com \
#         -d api.colourbricks.livewiresdigitalsolutions.com
# (certbot rewrites this file in place to add the TLS server blocks — don't hand-edit
# around it afterwards without re-diffing).

# ---- Frontend: app.colourbricks.livewiresdigitalsolutions.com -> Next.js on :3003 ----
server {
    listen 80;
    server_name app.colourbricks.livewiresdigitalsolutions.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ---- API: api.colourbricks.livewiresdigitalsolutions.com -> ASP.NET Core on :5095 ----
server {
    listen 80;
    server_name api.colourbricks.livewiresdigitalsolutions.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
