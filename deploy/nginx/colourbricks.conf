# Install: sudo cp deploy/nginx/colourbricks.conf /etc/nginx/sites-available/colourbricks
#          sudo ln -s /etc/nginx/sites-available/colourbricks /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then run certbot against both server_names to fill in the TLS blocks.

# ---- Frontend: app.yourdomain.com -> Next.js on :3000 ----
server {
    listen 80;
    server_name app.yourdomain.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- API: api.yourdomain.com -> ASP.NET Core on :5095 ----
server {
    listen 80;
    server_name api.yourdomain.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:5095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
